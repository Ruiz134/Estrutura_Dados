[project]
name = "estrutura-dados"
version = "0.1.0"
description = "Projeto de estrutura de dados"
authors = [
    {name = "Alan Ruiz"}
]
license = "Não"
requires-python = "3.11.3"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
